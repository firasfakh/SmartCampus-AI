# SmartCampus AI — environnement local (SA-9)
#
#   Base seule (recommandé, le backend tourne dans le venv) :
#       docker compose up -d db
#   Base + backend dans Docker :
#       docker compose --profile full up -d --build
#
# Les valeurs par défaut correspondent à backend/.env.example.
# Pour les changer, créer un fichier .env à la racine (voir .env.example).

services:
  db:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 + pgvector (RAG plus tard)
    container_name: smartcampus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - smartcampus_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcampus} -d ${POSTGRES_DB:-smartcampus_db}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: smartcampus-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dans le réseau Docker, la base s'appelle « db » et écoute sur 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  smartcampus_pgdata:
